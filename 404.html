<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Defend Your Experience</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2312141F'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='%23F5A623'%3E%C2%AB%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <style>
    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-4);
    }
    .not-found-wrap { max-width: 480px; }
    .not-found-code {
      font-family: var(--font-display);
      font-size: 5rem;
      font-weight: 700;
      color: var(--color-accent);
      line-height: 1;
      margin-bottom: var(--space-3);
    }
    .not-found-title {
      font-family: var(--font-display);
      font-size: var(--fs-2xl);
      font-weight: 700;
      margin-bottom: var(--space-3);
    }
    .not-found-text {
      color: var(--color-text-muted);
      margin-bottom: var(--space-5);
      line-height: 1.6;
    }
    .not-found-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: 14px 28px;
      border-radius: var(--radius-full);
      background: var(--color-accent);
      color: var(--color-accent-contrast);
      font-weight: 600;
      text-decoration: none;
    }
    .not-found-link:hover {
      background: var(--color-accent-strong);
    }
  </style>
</head>
<body>
  <div class="not-found-wrap">
    <div class="not-found-code">404</div>
    <h1 class="not-found-title">This page couldn't be found.</h1>
    <p class="not-found-text">
      The page you're looking for doesn't exist. If you followed a link here, it may be outdated —
      but the app itself is alive and well.
    </p>
    <a class="not-found-link" href="/defend-your-experience/">← Back to Defend Your Experience</a>
  </div>
</body>
</html>
